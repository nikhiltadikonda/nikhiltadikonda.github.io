name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - 'release/**'
      - 'release/v*.*.*'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - master
      - 'release/v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      VITE_QUOTES_API_URL: ${{ secrets.REACT_APP_QUOTES_API_URL }}
      VITE_GITHUB_API_URL: ${{ secrets.REACT_APP_GITHUB_API_URL }}
      VITE_SOCIALIFY_URL: ${{ secrets.REACT_APP_SOCIALIFY_URL }}
      VITE_SOCIALIFY_URL_PARAM: ${{ secrets.REACT_APP_SOCIALIFY_URL_PARAM }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: ./dist
          if-no-files-found: error

  determine-deployment:
    name: Determine Deployment Target
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      target: ${{ steps.eval.outputs.target }}
      dest_dir: ${{ steps.eval.outputs.dest_dir }}
    steps:
      - name: Evaluate Ref & Deployment Route
        id: eval
        run: |
          REF="${{ github.ref }}"
          REF_NAME="${{ github.ref_name }}"
          echo "Evaluating ref: $REF with ref_name: $REF_NAME"

          # 1. Tagged Version Release -> Root Production (nikhiltadikonda.github.io)
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "Matched Version Tag -> Deploying to Production (root)"
            echo "target=production" >> $GITHUB_OUTPUT
            echo "dest_dir=." >> $GITHUB_OUTPUT

          # 2. Main / Master Branch -> Dev Release (nikhiltadikonda.github.io/dev)
          elif [[ "$REF_NAME" == "main" || "$REF_NAME" == "master" ]]; then
            echo "Matched Main Branch -> Deploying to Dev (nikhiltadikonda.github.io/dev)"
            echo "target=dev" >> $GITHUB_OUTPUT
            echo "dest_dir=dev" >> $GITHUB_OUTPUT

          # 3. Release Branch (SemVer regex) -> Stage Release (nikhiltadikonda.github.io/stage)
          # Pattern: ^release\/v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
          elif [[ "$REF_NAME" =~ ^release\/v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Matched Release Branch SemVer ($REF_NAME) -> Deploying to Stage (nikhiltadikonda.github.io/stage)"
            echo "target=stage" >> $GITHUB_OUTPUT
            echo "dest_dir=stage" >> $GITHUB_OUTPUT

          else
            echo "Ref $REF_NAME does not match any automated deployment target. Skipping deployment."
            echo "target=none" >> $GITHUB_OUTPUT
            echo "dest_dir=" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy (${{ needs.determine-deployment.outputs.target }})
    needs: [validate-and-build, determine-deployment]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.determine-deployment.outputs.target != 'none' && needs.determine-deployment.outputs.target != ''
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ needs.determine-deployment.outputs.dest_dir == '.' && '' || needs.determine-deployment.outputs.dest_dir }}
          keep_files: true
