name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'release/v*.*.*'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
      - 'release/v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      VITE_QUOTES_API_URL: ${{ secrets.REACT_APP_QUOTES_API_URL }}
      VITE_GITHUB_API_URL: ${{ secrets.REACT_APP_GITHUB_API_URL }}
      VITE_SOCIALIFY_URL: ${{ secrets.REACT_APP_SOCIALIFY_URL }}
      VITE_SOCIALIFY_URL_PARAM: ${{ secrets.REACT_APP_SOCIALIFY_URL_PARAM }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm test

      - name: Build Production Bundle
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: ./dist
          if-no-files-found: error

  determine-deployment:
    name: Determine Deployment Target
    needs: validate-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    outputs:
      target: ${{ steps.eval.outputs.target }}
      dest_dir: ${{ steps.eval.outputs.dest_dir }}
      tag_name: ${{ steps.eval.outputs.tag_name }}
      version: ${{ steps.eval.outputs.version }}
    steps:
      - name: Evaluate Ref & Deployment Route
        id: eval
        run: |
          REF="${{ github.ref }}"
          REF_NAME="${{ github.ref_name }}"
          echo "Evaluating ref: $REF with ref_name: $REF_NAME"

          # 1. Tagged Version Release -> Root Production (nikhiltadikonda.github.io)
          if [[ "$REF" == refs/tags/v* ]]; then
            TAG_NAME="${REF_NAME}"
            VERSION="${REF_NAME#v}"
            echo "Matched Version Tag -> Deploying to Production (root)"
            echo "target=prod" >> $GITHUB_OUTPUT
            echo "dest_dir=." >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 2. Main Branch -> Dev Release (nikhiltadikonda.github.io/dev)
          elif [[ "$REF_NAME" == "main" ]]; then
            echo "Matched Main Branch -> Deploying to Dev (nikhiltadikonda.github.io/dev)"
            echo "target=dev" >> $GITHUB_OUTPUT
            echo "dest_dir=dev" >> $GITHUB_OUTPUT
            echo "tag_name=" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT

          # 3. Release Branch (SemVer regex) -> Stage Release (nikhiltadikonda.github.io/stage)
          # Pattern: ^release\/v?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$
          elif [[ "$REF_NAME" =~ ^release\/v?((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TAG_NAME="v${VERSION}"
            echo "Matched Release Branch SemVer ($REF_NAME) -> Deploying to Stage (nikhiltadikonda.github.io/stage)"
            echo "target=stage" >> $GITHUB_OUTPUT
            echo "dest_dir=stage" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT

          else
            echo "Ref $REF_NAME does not match any automated deployment target. Skipping deployment."
            echo "target=none" >> $GITHUB_OUTPUT
            echo "dest_dir=" >> $GITHUB_OUTPUT
            echo "tag_name=" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy (${{ needs.determine-deployment.outputs.target }})
    needs: [validate-and-build, determine-deployment]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.determine-deployment.outputs.target != 'none' && needs.determine-deployment.outputs.target != ''
    permissions:
      contents: write

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-artifact
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ needs.determine-deployment.outputs.dest_dir == '.' && '' || needs.determine-deployment.outputs.dest_dir }}
          keep_files: true

  create-draft-release-post-stage:
    name: Create Draft Release Post-Stage
    needs: [determine-deployment, deploy]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.determine-deployment.outputs.target == 'stage'
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Create Draft Release on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.determine-deployment.outputs.tag_name }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Processing draft release creation for tag: $TAG_NAME on branch: $BRANCH_NAME"

          if [[ -z "$TAG_NAME" ]]; then
            if [[ -f "VERSION" ]]; then
              TAG_NAME="v$(tr -d '[:space:]' < VERSION)"
            else
              TAG_NAME="v$(node -p "require('./package.json').version")"
            fi
          fi

          echo "Target tag name: $TAG_NAME"
          echo "Target branch:    $BRANCH_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "ℹ️ Release for '$TAG_NAME' already exists. Skipping draft release creation."
          else
            echo "🚀 Creating draft release '$TAG_NAME' targeted at branch '$BRANCH_NAME'..."
            gh release create "$TAG_NAME" \
              --target "$BRANCH_NAME" \
              --title "$TAG_NAME" \
              --draft \
              --generate-notes
            echo "✅ Successfully created draft release '$TAG_NAME' with target branch '$BRANCH_NAME'."
          fi

  bump-version-post-prod:
    name: Bump Version Post-Production
    needs: [determine-deployment, deploy]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.determine-deployment.outputs.target == 'prod'
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Git Author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Increment Version in VERSION and package.json
        run: |
          # Increment patch version in package.json without creating git tag
          NEW_VERSION=$(npm version patch --no-git-tag-version)
          CLEAN_VERSION="${NEW_VERSION#v}"
          echo "$CLEAN_VERSION" > VERSION
          echo "Incremented version to $CLEAN_VERSION"

          git add VERSION package.json
          git commit -m "chore(release): bump version to $CLEAN_VERSION [skip ci]" || echo "No changes to commit"
          git push origin main
